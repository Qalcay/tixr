# Tixr-sigma workspace.
#
# Two crates, split on purpose:
#   sigma-engine : the market simulation. Zero third-party dependencies, so it
#                  compiles in seconds and its tests never build a GUI stack.
#   sigma-app    : the egui desktop front-end. Depends on the engine + eframe.
[workspace]
resolver = "3"
members = ["crates/sigma-engine", "crates/sigma-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
strip = "debuginfo"

# Line tables are enough for readable backtraces and much smaller than full
# debug info.
[profile.dev]
debug = "line-tables-only"

# Debug builds of the engine are painfully slow for a simulator; optimise the
# engine even in dev so `cargo run` is usable while the app stays debuggable.
[profile.dev.package.sigma-engine]
opt-level = 2

# Keep dev artefacts small: no debug info for third-party crates. This is the
# single biggest saving on target/ size after dropping wgpu.
[profile.dev.package."*"]
debug = false
opt-level = 1
